services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uvicorn backend.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Override so SQLite is persisted on the host under ./data/
      CHECKPOINTER_DB: /app/data/chat_history.db
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python -m backend.worker.sqs_listener
    env_file: .env
    volumes:
      # Shares the same Chroma store the api reads from
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the Next.js bundle at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    restart: unless-stopped
